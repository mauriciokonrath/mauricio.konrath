  <style>
    :root {
      --bg: #F5F6F8;
      --ink: #151B26;
      --muted: #545F6F;
      --line: #D9DEE5;
      --accent: #2B44B5;
      --ok: #0B7A57;
      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --header-h: 64px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F141D; --ink: #E3E7ED; --muted: #9BA6B6; --line: #273145; --accent: #A3B4FF; --ok: #66D1A8;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0F141D; --ink: #E3E7ED; --muted: #9BA6B6; --line: #273145; --accent: #A3B4FF; --ok: #66D1A8;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--serif); font-size: 1.1875rem; line-height: 1.6;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2.5rem); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip { position: absolute; left: 1rem; top: -100px; z-index: 100; background: var(--ink); color: var(--bg); padding: 0.6rem 0.9rem; text-decoration: none; }
    .skip:focus { top: 1rem; }

    /* Cabeçalho */
    .site-header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .site-header.scrolled { border-bottom-color: var(--line); }
    .bar { display: flex; align-items: center; gap: 1.5rem; height: var(--header-h); }
    .brand { font-weight: 600; font-size: 1.0625rem; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; }
    .nav ul { display: flex; gap: 1.25rem; list-style: none; margin: 0; padding: 0; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 1.0625rem; }
    .nav a:hover, .nav a[aria-current="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); }
    .tools { display: flex; align-items: center; gap: 0.5rem; }
    .lang { display: flex; }
    .lang button {
      font: inherit; font-size: 1rem; background: none; border: 0; padding: 0.25rem 0.35rem;
      color: var(--muted); cursor: pointer;
    }
    .lang button:hover { color: var(--ink); }
    .lang button[aria-pressed="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 0.25em; }
    .icon-btn { background: none; border: 0; color: var(--ink); width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; border-radius: 6px; padding: 0; }
    .icon-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
    .icon-btn svg { width: 18px; height: 18px; }
    .menu-btn { display: none; }

    /* Abertura com a rede de fundo */
    .hero {
      position: relative; isolation: isolate; overflow: hidden;
      padding: clamp(5rem, 12vw, 9rem) 0 clamp(4rem, 9vw, 7rem);
      border-bottom: 1px solid var(--line);
    }
    .hero > .wrap { position: relative; z-index: 2; }
    .hero::after {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--bg) 75%, transparent) 0%, transparent 65%),
        radial-gradient(circle at 60% 45%, transparent 0%, color-mix(in srgb, var(--bg) 85%, transparent) 100%);
    }
    .hero-network { position: absolute; inset: -2%; z-index: 0; pointer-events: none; animation: network-drift 22s ease-in-out infinite alternate; }
    .hero-network svg { width: 100%; height: 100%; display: block; }
    .net-link { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke: color-mix(in srgb, var(--ink) 16%, transparent); stroke-width: 1.1; }
    .net-link.soft { stroke: color-mix(in srgb, var(--ink) 8%, transparent); stroke-width: 0.8; }
    .net-node { fill: color-mix(in srgb, var(--ink) 26%, transparent); }
    .net-node.soft { fill: color-mix(in srgb, var(--ink) 14%, transparent); }
    .net-lock rect { fill: var(--bg); stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1; }
    .net-lock path { fill: none; stroke: color-mix(in srgb, var(--ink) 34%, transparent); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .net-lock circle { fill: color-mix(in srgb, var(--ink) 34%, transparent); }
    @keyframes network-drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-12px, 8px, 0) scale(1.025); } }

    .hero-inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(2rem, 5vw, 4rem); align-items: center; }
    .hero-inner.has-photo { grid-template-columns: minmax(0, 1fr) auto; }
    .photo { margin: 0; }
    .photo img { display: block; width: clamp(150px, 18vw, 220px); aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
    .hero h1 { font-size: clamp(2.75rem, 6vw, 4.25rem); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 1.5rem; }
    .intro { font-size: clamp(1.25rem, 2vw, 1.45rem); line-height: 1.5; max-width: 40rem; margin: 0; }
    .hero-links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.6rem; list-style: none; margin: 2rem 0 0; padding: 0; font-size: 1.0625rem; }

    /* Seções */
    .sec { padding: clamp(3.5rem, 7vw, 5.5rem) 0; border-bottom: 1px solid var(--line); }
    .sec:last-of-type { border-bottom: 0; }
    .sec-grid { display: grid; grid-template-columns: 12rem minmax(0, 44rem); gap: clamp(1.5rem, 5vw, 4rem); }
    .sec h2 { font-size: 1.375rem; font-weight: 600; line-height: 1.3; margin: 0; }
    .sec-note { color: var(--muted); font-size: 1rem; margin: 0.35rem 0 0; }
    .prose p { margin: 0 0 1em; }
    .prose p:last-child { margin-bottom: 0; }

    .skills { margin: 2.25rem 0 0; }
    .skills dt { font-weight: 600; font-size: 1.0625rem; }
    .skills dd { margin: 0 0 1rem; color: var(--muted); }
    .skills dd:last-child { margin-bottom: 0; }

    .research { list-style: none; margin: 0; padding: 0; }
    .research li { margin: 0 0 2.25rem; }
    .research li:last-child { margin-bottom: 0; }
    .research h3, .rows h3 { font-size: 1.2rem; font-weight: 600; line-height: 1.35; margin: 0 0 0.35rem; }
    .research p { margin: 0 0 0.45rem; }
    .related { font-size: 1rem; color: var(--muted); }
    .related a { margin-right: 0.8rem; }

    .year { font-size: 1.0625rem; font-weight: 600; color: var(--muted); margin: 0 0 1.1rem; font-variant-numeric: tabular-nums; }
    .year ~ .year { margin-top: 2.75rem; }
    .pubs { list-style: none; margin: 0; padding: 0; }
    .pub { margin: 0 0 2rem; }
    .pub:last-child { margin-bottom: 0; }
    .pub-title { font-size: 1.2rem; font-weight: 600; line-height: 1.35; margin: 0 0 0.35rem; }
    .pub-title a { color: var(--ink); text-decoration-color: color-mix(in srgb, var(--ink) 30%, transparent); }
    .pub-title a:hover { color: var(--accent); text-decoration-color: currentColor; }
    .pub-meta { margin: 0; font-size: 1.0625rem; color: var(--muted); }
    .pub-meta strong { color: var(--ink); font-weight: 600; }
    .status { color: var(--accent); }
    .pub-actions { display: flex; flex-wrap: wrap; gap: 0.2rem 1.25rem; margin: 0.45rem 0 0; font-size: 1rem; }
    .link-btn {
      font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent);
      text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em;
      text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .link-btn:hover { text-decoration-color: currentColor; }
    .link-btn.done { color: var(--ok); text-decoration: none; }
    .pub-abs { margin: 0.8rem 0 0; padding-left: 1rem; border-left: 2px solid var(--line); font-size: 1.0625rem; }
    .pub-abs p { margin: 0; }

    .news { list-style: none; margin: 0; padding: 0; }
    .news li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1.25rem; margin: 0 0 0.8rem; }
    .news li:last-child { margin-bottom: 0; }
    .news time { color: var(--muted); font-size: 1rem; padding-top: 0.12rem; font-variant-numeric: tabular-nums; }
    .sub { font-size: 1.0625rem; font-weight: 600; color: var(--muted); margin: 0 0 1.1rem; }
    .sub ~ .sub { margin-top: 2.75rem; }
    .rows { list-style: none; margin: 0; padding: 0; }
    .rows li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 1.25rem; margin: 0 0 2rem; }
    .rows li:last-child { margin-bottom: 0; }
    .when { color: var(--muted); font-size: 1rem; line-height: 1.5; padding-top: 0.15rem; font-variant-numeric: tabular-nums; }
    .when span { display: block; }
    .org { margin: 0; font-style: italic; }
    .place { margin: 0 0 0.45rem; color: var(--muted); font-size: 1rem; }
    .desc { margin: 0; }
    .org + .desc { margin-top: 0.45rem; }

    .contact-lede { margin: 0 0 1.5rem; }
    .contact { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 0.55rem 1rem; margin: 0; }
    .contact dt { color: var(--muted); }
    .contact dd { margin: 0; overflow-wrap: anywhere; }

    footer { padding: 2rem 0 2.5rem; color: var(--muted); font-size: 1rem; border-top: 1px solid var(--line); }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 2rem; }
    footer p { margin: 0; }

    @media (max-width: 900px) {
      .menu-btn { display: inline-grid; }
      .nav { position: absolute; top: var(--header-h); left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--line); display: none; }
      .nav.open { display: block; }
      .nav ul { flex-direction: column; gap: 0; padding: 0.25rem clamp(1.25rem, 4vw, 2.5rem) 1rem; }
      .nav a { display: block; padding: 0.7rem 0; font-size: 1.125rem; }
    }
    @media (max-width: 760px) {
      .sec-grid { grid-template-columns: 1fr; gap: 1.25rem; }
      .rows li { grid-template-columns: 1fr; gap: 0.2rem; }
      .news li { grid-template-columns: 1fr; gap: 0; margin-bottom: 1.1rem; }
      .hero-inner.has-photo { grid-template-columns: 1fr; }
      .hero-inner.has-photo .photo { order: -1; }
      .photo img { width: 120px; }
      .when span { display: inline; }
      .when span + span::before { content: ", "; }
      .contact { grid-template-columns: 1fr; gap: 0 0; }
      .contact dd { margin-bottom: 0.7rem; }
    }
    @media (max-width: 420px) {
      .bar { gap: 0.75rem; }
      .brand { font-size: 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-network { animation: none; }
    }

    function parseYM(s) { const [y, m] = s.split('-').map(Number); return { y, m }; }
    function fmtYM(s, t) { const d = parseYM(s); return t.months[d.m - 1] + ' ' + d.y; }
    function duration(start, end, t) {
      const a = parseYM(start);
      const now = new Date();
      const b = end ? parseYM(end) : { y: now.getFullYear(), m: now.getMonth() + 1 };
      const total = Math.max(1, (b.y - a.y) * 12 + (b.m - a.m) + 1);
      return t.dur(Math.floor(total / 12), total % 12);
    }

    function pubItem(p, t) {
      const L = t.pubs[p.id];

      const titleHtml = p.href ? `<a href="${p.href}" target="_blank" rel="noopener">${title}</a>` : title;
      return `
        <li class="pub" id="pub-${p.id}">
          <p class="pub-title">${titleHtml}</p>
          <p class="pub-meta">${p.authors}<br>${L.venue}${L.status ? `, <span class="status">${L.status}</span>` : ''}</p>
          <p class="pub-actions">
            <button type="button" class="link-btn" data-abs="${p.id}" aria-expanded="false" aria-controls="abs-${p.id}">${t.abstract}</button>
            <button type="button" class="link-btn" data-copy="${p.id}" data-fmt="text">${t.copyCite}</button>
            <button type="button" class="link-btn" data-copy="${p.id}" data-fmt="bib">${t.copyBib}</button>
            ${p.code ? `<a href="${p.code}" target="_blank" rel="noopener">${t.code}</a>` : ''}
            ${p.href ? `<a href="${p.href}" target="_blank" rel="noopener">DOI</a>` : ''}
          </p>
          <div class="pub-abs" id="abs-${p.id}" hidden><p>${L.desc}</p></div>
        </li>`;
    }

      $('nav').setAttribute('aria-label', t.navLabel);
      $('navList').innerHTML = t.nav.map((label, i) => `<li><a href="#${NAV_IDS[i]}">${label}</a></li>`).join('');

      $('heroLinks').innerHTML = HERO_LINKS.map((l) =>
        `<li><a href="${l.href}"${l.href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${t.linkLabels[l.k]}</a></li>`).join('');
      const photo = $('photo');
      if (SITE.photo) {
        photo.hidden = false;
        photo.innerHTML = `<img src="${SITE.photo}" alt="${t.photoAlt}" width="220" height="275">`;
        $('heroInner').classList.add('has-photo');
      }

      $('newsList').innerHTML = NEWS.map((n) => {
        const [y, m] = n.date.split('-').map(Number);
        return `<li><time datetime="${n.date}">${t.months[m - 1]} ${y}</time><span>${t.news[n.id]}</span></li>`;
      }).join('');

      $('talkList').innerHTML = t.talks.map((k) => `
        <li>
          <p class="when"><span>${k.when}</span></p>
          <div>
            <h3>${k.title}</h3>
            <p class="org">${k.org}</p>
            <p class="place">${k.place}</p>
          </div>
        </li>`).join('');

      $('teachList').innerHTML = t.teaching.map((k) => `
        <li>
          <p class="when"><span>${k.when}</span></p>
          <div>
            <h3>${k.title}</h3>
            <p class="org">${k.org}</p>
            <p class="desc">${k.desc}</p>
          </div>
        </li>`).join('');

      $('aboutText').innerHTML = t.aboutText.map((p) => `<p>${p}</p>`).join('');
      $('skills').innerHTML = t.skills.map(([dt, dd]) => `<dt>${dt}</dt><dd>${dd}</dd>`).join('');

      $('researchList').innerHTML = t.research.map((r) => `
        <li>
          <h3>${r.title}</h3>
          <p>${r.desc}</p>
          <p class="related">${r.rel
            ? t.relatedLabel + ': ' + r.rel.map((l) => `<a href="${l.href}" data-open>${l.label}</a>`).join('')
            : r.note}</p>
        </li>`).join('');

      $('pubNote').textContent = t.pubNote(PUBS.length);
      const years = [...new Set(PUBS.map((p) => p.year))];
      $('pubList').innerHTML = years.map((y) => `
        <h3 class="year">${y}</h3>
        <ol class="pubs">${PUBS.filter((p) => p.year === y).map((p) => pubItem(p, t)).join('')}</ol>`).join('');

      $('expList').innerHTML = EXP.map((e) => {
        const L = t.exp[e.key];
        const period = fmtYM(e.start, t) + ' – ' + (e.end ? fmtYM(e.end, t) : t.present);
        return `
        <li>
          <p class="when"><span>${period}</span><span>${duration(e.start, e.end, t)}</span></p>
          <div>
            <h3>${L.role}</h3>
            <p class="org">${L.org}</p>
            <p class="place">${L.loc}</p>
            <p class="desc">${L.desc}</p>
          </div>
        </li>`;
      }).join('');

      $('eduList').innerHTML = t.edu.map((e) => `
        <li>
          <p class="when"><span>${e.period}</span>${e.note ? `<span>${e.note}</span>` : ''}</p>
          <div>
            <h3>${e.degree}</h3>
            <p class="org">${e.inst}</p>
            <p class="desc">${e.desc}</p>
          </div>
        </li>`).join('');

      $('contactList').innerHTML = CONTACT.map((c) =>
        `<dt>${t.contactLabels[c.k]}</dt><dd><a href="${c.href}"${c.href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${c.v}</a></dd>`
      ).join('');

      document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      updateThemeBtn();
      setMenu(false);
      observeSections();
    }

    function setLang(l) {
      if (!T[l]) return;
      lang = l;
      store.set('mk-lang', l);
      render(T[l]);
    }

    /* Tema */
    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
    const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function effectiveTheme() { return root.getAttribute('data-theme') || (darkQuery.matches ? 'dark' : 'light'); }
    function updateThemeBtn() {
      const dark = effectiveTheme() === 'dark';
      const btn = $('themeBtn');
      btn.innerHTML = dark ? ICON_SUN : ICON_MOON;
      btn.setAttribute('aria-label', dark ? T[lang].toLight : T[lang].toDark);
      btn.title = btn.getAttribute('aria-label');
    }
    $('themeBtn').addEventListener('click', () => {
      const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      store.set('mk-theme', next);
      updateThemeBtn();
    });
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', updateThemeBtn);

    /* Menu no celular */
    const nav = $('nav');
    const menuBtn = $('menuBtn');
    function setMenu(open) {
      nav.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
      menuBtn.setAttribute('aria-label', open ? T[lang].menuClose : T[lang].menuOpen);
    }
    menuBtn.addEventListener('click', () => setMenu(!nav.classList.contains('open')));
    nav.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
    document.addEventListener('click', (e) => {
      if (nav.classList.contains('open') && !e.target.closest('.site-header')) setMenu(false);
    });

    document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

    /* Resumo, citação e links da seção de pesquisa */
    function setAbstract(id, open) {
      const box = $('abs-' + id);
      const btn = document.querySelector(`button[data-abs="${id}"]`);
      if (!box || !btn) return;
      box.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return; }
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) throw new Error('copy failed');
    }

    document.addEventListener('click', async (e) => {
      const abs = e.target.closest('button[data-abs]');
      if (abs) { setAbstract(abs.dataset.abs, abs.getAttribute('aria-expanded') !== 'true'); return; }

      const open = e.target.closest('a[data-open]');
      if (open) { setAbstract(open.getAttribute('href').replace('#pub-', ''), true); return; }

      const btn = e.target.closest('button[data-copy]');
      if (!btn) return;
      const c = CITES[btn.dataset.copy];
      if (!c) return;
      const t = T[lang];
      const isBib = btn.dataset.fmt === 'bib';
      const original = isBib ? t.copyBib : t.copyCite;
      try {
        await copyText(isBib ? c.bib : c.text);
        btn.classList.add('done');
        btn.textContent = isBib ? t.bibCopied : t.citeCopied;
        $('live').textContent = btn.textContent;
      } catch (err) {
        btn.textContent = t.copyFail;
        $('live').textContent = t.copyFail;
      }
      clearTimeout(btn._timer);
      btn._timer = setTimeout(() => { btn.classList.remove('done'); btn.textContent = original; }, 2000);
    });

    /* Cabeçalho e seção ativa */
    const header = $('siteHeader');
    function onScroll() { header.classList.toggle('scrolled', window.scrollY > 8); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    let io;
    function observeSections() {
      if (!('IntersectionObserver' in window)) return;
      if (io) io.disconnect();
      io = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          document.querySelectorAll('#navList a').forEach((a) =>
            a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + en.target.id)));
        });
      }, { rootMargin: '-45% 0px -50% 0px' });
      NAV_IDS.forEach((id) => { const s = $(id); if (s) io.observe(s); });
    }

    const saved = store.get('mk-lang');
    const nav0 = (navigator.language || 'pt').toLowerCase();
    lang = T[saved] ? saved : nav0.startsWith('pt') ? 'pt' : nav0.startsWith('es') ? 'es' : nav0.startsWith('en') ? 'en' : 'pt';
    render(T[lang]);
  })();
  </script>
</body>
</html>
