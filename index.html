  <style>
    :root {
      --bg:         #0d0e0f;
      --bg-card:    #131416;
      --bg-hover:   #191b1d;
      --border:     #1e2022;
      --border-mid: #2a2d30;
      --text:       #e4e2dd;
      --text-muted: #787570;
      --text-dim:   #434140;
      --accent:     #8fa8b8;
      --accent-dim: #3a5568;
      --mono:       'IBM Plex Mono', monospace;
      --serif:      'Cormorant Garamond', serif;
      --sans:       'IBM Plex Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }
    .container { max-width: 920px; margin: 0 auto; padding: 0 2rem; }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      background: rgba(13,14,15,0.9);
    }
    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      gap: 1rem;
    }
    .nav-logo {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; flex: 1; justify-content: center; }
    .nav-links a {
      font-family: var(--mono);
      font-size: 0.63rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .menu-toggle {
      display: none;
      width: 40px;
      height: 36px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
    }
    .menu-toggle span {
      display: block;
      width: 14px;
      height: 1px;
      background: currentColor;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .menu-toggle:hover { border-color: var(--border-mid); background: rgba(255,255,255,0.02); }
    .menu-toggle.active span:first-child { transform: translateY(2.5px) rotate(45deg); }
    .menu-toggle.active span:last-child { transform: translateY(-2.5px) rotate(-45deg); }

    /* LANGUAGE SWITCHER */
    .lang-switcher {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .lang-btn {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.3rem 0.55rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn:hover { border-color: var(--border-mid); color: var(--text-muted); }
    .lang-btn.active { border-color: var(--accent-dim); color: var(--accent); background: rgba(58,85,104,0.15); }

    /* HERO */
    #hero {
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding-top: 56px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 30%, rgba(143,168,184,0.10), transparent 28%),
        radial-gradient(circle at 78% 58%, rgba(143,168,184,0.08), transparent 30%),
        radial-gradient(circle at 50% 40%, rgba(255,255,255,0.03), transparent 35%);
      pointer-events: none;
      z-index: 0;
    }
    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(13,14,15,0.12) 0%, rgba(13,14,15,0.54) 58%, rgba(13,14,15,0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .hero-network {
      position: absolute;
      inset: -2%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.42;
      animation: networkDrift 22s ease-in-out infinite alternate;
    }
    .hero-network svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .network-link,
    .network-link-soft {
      fill: none;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .network-link {
      stroke: rgba(255,255,255,0.10);
      stroke-width: 1.1;
    }
    .network-link-soft {
      stroke: rgba(255,255,255,0.055);
      stroke-width: 0.8;
    }
    .network-node {
      fill: rgba(255,255,255,0.18);
    }
    .network-node.soft {
      fill: rgba(255,255,255,0.09);
    }
    .network-lock {
      opacity: 0.24;
    }
    .network-lock .lock-body {
      fill: rgba(255,255,255,0.055);
      stroke: rgba(255,255,255,0.12);
      stroke-width: 1;
    }
    .network-lock .lock-arc {
      fill: none;
      stroke: rgba(255,255,255,0.14);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .network-lock .lock-dot {
      fill: rgba(255,255,255,0.13);
    }
    .hero-line { display: none; }
    .hero-content { position: relative; z-index: 3; padding: 6rem 0 5rem; }

    @keyframes networkDrift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(-10px, 6px, 0) scale(1.02); }
    }
    .hero-tag {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .hero-tag::before {
      content: '';
      display: block;
      width: 1.8rem;
      height: 1px;
      background: var(--accent);
      flex-shrink: 0;
    }
    h1.hero-name {
      font-family: var(--serif);
      font-size: clamp(3.2rem, 8.5vw, 6.2rem);
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -0.015em;
      color: var(--text);
      margin-bottom: 0.2rem;
    }
    h1.hero-name em { font-style: italic; color: var(--text-muted); }
    .hero-role {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-bottom: 2.75rem;
    }
    .hero-bio {
      max-width: 560px;
      font-size: 0.93rem;
      color: var(--text-muted);
      line-height: 1.85;
      margin-bottom: 3rem;
      border-left: 1px solid var(--border-mid);
      padding-left: 1.5rem;
    }
    .hero-cta { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border-mid);
      color: var(--text-muted);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn:hover { border-color: var(--accent-dim); color: var(--text); background: var(--bg-hover); }
    .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--text); }
    .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }

    /* SECTIONS */
    section { padding: 5.5rem 0; border-top: 1px solid var(--border); }
    .section-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    h2.section-title {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4vw, 2.9rem);
      font-weight: 300;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 2.75rem;
    }

    /* ABOUT */
    .about-grid { display: grid; grid-template-columns: 1fr 300px; gap: 4rem; align-items: start; }
    .about-text p { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.9; }
    .about-text p strong { color: var(--text); font-weight: 400; }
    .about-sidebar { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--border); }
    .stat-card {
      padding: 1.5rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .stat-card:last-child { border-bottom: none; }
    .stat-card:hover { background: var(--bg-hover); }
    .stat-number { font-family: var(--serif); font-size: 2.2rem; font-weight: 300; color: var(--text); line-height: 1; margin-bottom: 0.35rem; }
    .stat-label { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); line-height: 1.5; }

    /* EDUCATION */
    .edu-list { display: flex; flex-direction: column; }
    .edu-item { display: grid; grid-template-columns: 160px 1fr; gap: 2rem; padding: 2.25rem 0; border-bottom: 1px solid var(--border); }
    .edu-item:last-child { border-bottom: none; }
    .edu-date { font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.06em; color: var(--text-dim); line-height: 1.6; padding-top: 0.1rem; }
    .edu-badge {
      display: inline-block;
      margin-top: 0.5rem;
      font-family: var(--mono);
      font-size: 0.57rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      padding: 0.2rem 0.55rem;
    }
    .edu-degree { font-size: 0.96rem; color: var(--text); font-weight: 400; margin-bottom: 0.2rem; }
    .edu-inst { font-family: var(--mono); font-size: 0.67rem; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.6rem; }
    .edu-desc { font-size: 0.84rem; color: var(--text-muted); line-height: 1.75; }

    /* SKILLS */
    .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border: 1px solid var(--border); }
    .skill-group { background: var(--bg-card); padding: 1.75rem; }
    .skill-group-title {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .skill-tags { display: flex; flex-direction: column; gap: 0.65rem; }
    .skill-tag { font-size: 0.83rem; color: var(--text-muted); display: flex; align-items: baseline; gap: 0.5rem; }
    .skill-tag::before { content: '—'; font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim); flex-shrink: 0; }

    /* PROJECTS */
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border: 1px solid var(--border); }
    .project-card {
      background: var(--bg-card);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      transition: background 0.2s;
    }
    .project-card:hover { background: var(--bg-hover); }
    .project-kicker {
      font-family: var(--mono);
      font-size: 0.56rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.95rem;
    }
    .project-title {
      font-family: var(--serif);
      font-size: 1.22rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 0.85rem;
    }
    .project-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 1.2rem;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: auto;
      margin-bottom: 1.1rem;
    }
    .project-tag {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border: 1px solid var(--border-mid);
      padding: 0.25rem 0.45rem;
      text-transform: uppercase;
    }
    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }
    .project-link {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(143,168,184,0.35);
      padding-bottom: 0.15rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .project-link:hover { color: var(--text); border-color: var(--accent); }

    /* EXPERIENCE */
    .exp-list { display: flex; flex-direction: column; }
    .exp-item { display: grid; grid-template-columns: 160px 1fr; gap: 2rem; padding: 2.25rem 0; border-bottom: 1px solid var(--border); }
    .exp-item:last-child { border-bottom: none; }
    .exp-date { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.05em; color: var(--text-dim); line-height: 1.65; padding-top: 0.1rem; }
    .exp-date .duration { color: var(--accent); display: block; margin-top: 0.35rem; }
    .exp-role { font-size: 0.96rem; color: var(--text); font-weight: 400; margin-bottom: 0.2rem; }
    .exp-company { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.3rem; }
    .exp-location { font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim); margin-bottom: 0.8rem; }
    .exp-desc { font-size: 0.84rem; color: var(--text-muted); line-height: 1.75; }

    /* RESEARCH */
    .research-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--border); }
    .research-card { padding: 2rem 2rem 2.25rem; background: var(--bg-card); transition: background 0.2s; }
    .research-card:hover { background: var(--bg-hover); }
    .research-idx { font-family: var(--mono); font-size: 0.58rem; color: var(--text-dim); margin-bottom: 1rem; }
    .research-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; color: var(--text); line-height: 1.3; margin-bottom: 0.8rem; }
    .research-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.75; }

    /* PUBLICATIONS */
    .pub-list { display: flex; flex-direction: column; }
    .pub-item { display: grid; grid-template-columns: 160px 1fr; gap: 2rem; padding: 2.25rem 0; border-bottom: 1px solid var(--border); }
    .pub-item:last-child { border-bottom: none; }
    .pub-meta { display: flex; flex-direction: column; gap: 0.5rem; padding-top: 0.1rem; }
    .pub-year { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); letter-spacing: 0.05em; }
    .pub-venue { font-family: var(--mono); font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.04em; line-height: 1.55; }
    .pub-title { font-family: var(--serif); font-size: 1.08rem; font-weight: 400; color: var(--text); line-height: 1.35; margin-bottom: 0.5rem; }
    .pub-authors { font-family: var(--mono); font-size: 0.61rem; color: var(--text-dim); letter-spacing: 0.04em; margin-bottom: 0.7rem; line-height: 1.5; }
    .pub-authors strong { color: var(--text-muted); font-weight: 500; }
    .pub-desc { font-size: 0.83rem; color: var(--text-muted); line-height: 1.75; margin-bottom: 0.85rem; }
    .pub-link {
      font-family: var(--mono);
      font-size: 0.61rem;
      letter-spacing: 0.04em;
      color: var(--accent-dim);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
      padding-bottom: 0.1rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .pub-link:hover { color: var(--accent); border-color: var(--accent); }

    /* CONTACT */
    .contact-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; border: 1px solid var(--border); }
    .contact-link {
      padding: 2rem 1.75rem;
      background: var(--bg-card);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      transition: background 0.2s;
    }
    .contact-link:hover { background: var(--bg-hover); }
    .contact-link-label { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
    .contact-link-value { font-size: 0.85rem; color: var(--accent); word-break: break-all; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 2rem 0; }
    footer .container { display: flex; justify-content: space-between; align-items: center; }
    footer p { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.06em; color: var(--text-dim); }

    /* ANIMATIONS */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-d1 { transition-delay: 0.1s; }

    /* RESPONSIVE */
    @media (max-width: 780px) {
      nav .container { position: relative; }
      .menu-toggle { display: inline-flex; }
      .nav-links {
        position: absolute;
        top: calc(100% + 0.75rem);
        left: 1rem;
        right: 1rem;
        flex: none;
        flex-direction: column;
        gap: 0;
        justify-content: flex-start;
        padding: 0.45rem;
        border: 1px solid var(--border-mid);
        background: rgba(19,20,22,0.98);
        backdrop-filter: blur(16px);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .nav-links.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      .nav-links a {
        display: block;
        padding: 0.85rem 0.9rem;
        border-bottom: 1px solid var(--border);
      }
      .nav-links li:last-child a { border-bottom: none; }
      .about-grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .edu-item, .exp-item, .pub-item { grid-template-columns: 1fr; gap: 0.4rem; }
      .skills-grid, .projects-grid, .research-grid { grid-template-columns: 1fr; }

  }

  function render(t) {
    // nav
    const nl = document.getElementById('navLinks');
    nl.innerHTML = t.nav.map((label, i) =>
      `<li><a href="#${t.navIds[i]}">${label}</a></li>`
    ).join('');
    document.getElementById('menuToggle').setAttribute('aria-label', t.menuOpen);

    // hero
    document.getElementById('heroTag').textContent = t.heroTag;
    document.getElementById('heroRole').textContent = t.heroRole;
    document.getElementById('heroBio').textContent = t.heroBio;
    document.getElementById('heroContact').textContent = t.heroContact;
    document.getElementById('heroProjects').textContent = t.heroProjects;

    // about
    document.getElementById('aboutLabel').textContent = t.aboutLabel;
    const titleParts = t.aboutTitle.split('\n');
    document.getElementById('aboutTitle').innerHTML =
      titleParts[0] + '<br><em>' + titleParts[1] + '</em>';
    document.getElementById('aboutText').innerHTML =
      t.aboutText.map(p => `<p>${p}</p>`).join('');
    document.getElementById('statMsc').textContent = t.statMsc;
    document.getElementById('statPubs').textContent = t.statPubs;
    document.getElementById('statSpringer').textContent = t.statSpringer;
    document.getElementById('statYears').textContent = t.statYears;

    // education
    document.getElementById('educationLabel').textContent = t.educationLabel;
    document.getElementById('educationTitle').textContent = t.educationTitle;
    document.getElementById('educationList').innerHTML = t.education.map(e => `
      <div class="edu-item reveal">
        <div class="edu-date">
          ${e.period}
          ${e.badge ? `<span class="edu-badge">${e.badge}</span>` : ''}
        </div>
        <div>
          <p class="edu-degree">${e.degree}</p>
          <p class="edu-inst">${e.inst}</p>
          <p class="edu-desc">${e.desc}</p>
        </div>
      </div>`).join('');

    // skills
    document.getElementById('skillsLabel').textContent = t.skillsLabel;
    document.getElementById('skillsTitle').textContent = t.skillsTitle;
    document.getElementById('skillsGrid').innerHTML = t.skillGroups.map(g => `
      <div class="skill-group">
        <p class="skill-group-title">${g.title}</p>
        <div class="skill-tags">
          ${g.items.map(i => `<span class="skill-tag">${i}</span>`).join('')}
        </div>
      </div>`).join('');

    // projects
    document.getElementById('projectsLabel').textContent = t.projectsLabel;
    document.getElementById('projectsTitle').textContent = t.projectsTitle;
    document.getElementById('projectsGrid').innerHTML = t.projects.map(p => `
      <article class="project-card">
        <p class="project-kicker">${p.kicker}</p>
        <h3 class="project-title">${p.title}</h3>
        <p class="project-desc">${p.desc}</p>
        <div class="project-tags">
          ${p.tags.map(tag => `<span class="project-tag">${tag}</span>`).join('')}
        </div>
        <div class="project-links">
          ${p.links.map(link => `<a class="project-link" href="${link.href}" ${link.href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>${link.label}</a>`).join('')}
        </div>
      </article>`).join('');

    // experience
    document.getElementById('expLabel').textContent = t.expLabel;
    document.getElementById('expTitle').textContent = t.expTitle;
    document.getElementById('expList').innerHTML = t.experience.map(e => `
      <div class="exp-item reveal">
        <div class="exp-date">
          ${e.period}
          <span class="duration">${e.duration}</span>
        </div>
        <div>
          <p class="exp-role">${e.role}</p>
          <p class="exp-company">${e.company}</p>
          <p class="exp-location">${e.location}</p>
          <p class="exp-desc">${e.desc}</p>
        </div>
      </div>`).join('');

    // research
    document.getElementById('researchLabel').textContent = t.researchLabel;
    const rParts = t.researchTitle.split('\n');
    document.getElementById('researchTitle').innerHTML =
      rParts[0] + '<br><em>' + rParts[1] + '</em>';
    document.getElementById('researchGrid').innerHTML = t.research.map(r => `
      <div class="research-card">
        <p class="research-idx">${r.idx}</p>
        <p class="research-title">${r.title}</p>
        <p class="research-desc">${r.desc}</p>
      </div>`).join('');

    // publications
    document.getElementById('pubLabel').textContent = t.pubLabel;
    const pParts = t.pubTitle.split('\n');
    document.getElementById('pubTitle').innerHTML =
      pParts[0] + '<br>' + pParts[1];
    document.getElementById('pubList').innerHTML = t.publications.map(p => `
      <div class="pub-item reveal">
        <div class="pub-meta">
          <span class="pub-year">${p.year}</span>
          <span class="pub-venue">${p.venue.replace(/\n/g,'<br>')}</span>
        </div>
        <div>
          <p class="pub-title">${p.title}</p>
          <p class="pub-authors">${p.authors}</p>
          <p class="pub-desc">${p.desc}</p>
          <a class="pub-link" href="${p.href}" target="_blank" rel="noopener">${p.doi}</a>
        </div>
      </div>`).join('');

    // contact
    document.getElementById('contactLabel').textContent = t.contactLabel;
    document.getElementById('contactTitle').textContent = t.contactTitle;
    document.getElementById('contactEmailLabel').textContent = t.contactEmailLabel;
    document.getElementById('contactLocLabel').textContent = t.contactLocLabel;

    // footer
    document.getElementById('footerSub').textContent = t.footerSub;
  }

  const navLinks = document.getElementById('navLinks');
  const menuToggle = document.getElementById('menuToggle');

  function setMenuOpen(isOpen) {
    navLinks.classList.toggle('open', isOpen);
    menuToggle.classList.toggle('active', isOpen);
    menuToggle.setAttribute('aria-expanded', String(isOpen));
    menuToggle.setAttribute('aria-label', isOpen ? T[currentLang].menuClose : T[currentLang].menuOpen);
  }

  menuToggle.addEventListener('click', () => {
    setMenuOpen(!navLinks.classList.contains('open'));
  });

  navLinks.addEventListener('click', (event) => {
    if (window.innerWidth <= 780 && event.target.closest('a')) setMenuOpen(false);
  });

  document.addEventListener('click', (event) => {
    if (window.innerWidth > 780) return;
    if (!event.target.closest('nav')) setMenuOpen(false);
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 780) setMenuOpen(false);
  });

  // Intersection observer
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.08 });

  document.getElementById('footerYear').textContent = new Date().getFullYear();

  // Initial render
  render(T.pt);
  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }, 100);
  </script>
</body>
</html>
